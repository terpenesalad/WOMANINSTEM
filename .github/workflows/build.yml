name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases

env:
  MODEL_URL: https://huggingface.co/datasets/Retrobear/demucs.cpp/resolve/main/ggml-model-htdemucs-6s-f16.bin
  MODEL_FILE: ggml-model-htdemucs-6s-f16.bin
  ASIO_URL: https://download.steinberg.net/sdk_downloads/ASIO-SDK_2.3.4_2025-10-15.zip
  ASIO_SHA256: d5ebf0c20dd2c5f43771fd0c1418f4b361bf52434ee670097cfa6b3a335e2eca
  # GeneralUser GS v2.0.3 by S. Christian Collins - the built-in General MIDI sound library (32 MB, free license)
  SF_COMMIT: 684543d5e5efaef08d02be50dcda8d552478fa60
  SF_SHA256: 9575028c7a1f589f5770fccc8cff2734566af40cd26ed836944e9a5152688cfe

jobs:
  windows:
    name: Windows x64 (exe + installer)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-win-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-win-

      - name: Cache stem model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models
          key: model-htdemucs-6s-f16-v1

      - name: Download stem model (Demucs v4 6-stem, 55 MB)
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path models | Out-Null
          Invoke-WebRequest -Uri $env:MODEL_URL -OutFile "models/$env:MODEL_FILE"
          (Get-Item "models/$env:MODEL_FILE").Length

      - name: Cache sound library
        id: sf-cache
        uses: actions/cache@v4
        with:
          path: sounds
          key: generaluser-gs-${{ env.SF_COMMIT }}

      - name: Download sound library (GeneralUser GS, 32 MB)
        if: steps.sf-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path sounds | Out-Null
          $base = "https://raw.githubusercontent.com/mrbumpy409/GeneralUser-GS/$env:SF_COMMIT"
          Invoke-WebRequest -Uri "$base/GeneralUser-GS.sf2" -OutFile "sounds/GeneralUser-GS.sf2"
          Invoke-WebRequest -Uri "$base/documentation/LICENSE.txt" -OutFile "sounds/GeneralUser-GS-LICENSE.txt"
          $hash = (Get-FileHash sounds/GeneralUser-GS.sf2 -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:SF_SHA256) { throw "SoundFont checksum mismatch: $hash" }

      - name: Cache piano samples
        id: piano-cache
        uses: actions/cache@v4
        with:
          path: pianos
          key: pianos-${{ hashFiles('Tools/prep_pianos.py') }}

      - name: Build the piano sample packs (Salamander grand, Splendid grand, Upright KW; ~90 MB)
        if: steps.piano-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m pip install --quiet soundfile numpy
          python Tools/prep_pianos.py piano-dl pianos
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=Piano samples::prep_pianos.py failed"; exit 1 }

      - name: Get the ASIO SDK (GPLv3) for low-latency audio
        id: asio
        shell: pwsh
        continue-on-error: true
        run: |
          Invoke-WebRequest -Uri $env:ASIO_URL -OutFile asiosdk.zip
          $hash = (Get-FileHash asiosdk.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:ASIO_SHA256) { throw "ASIO SDK checksum mismatch: $hash" }
          Expand-Archive asiosdk.zip -DestinationPath asio
          $dir = (Get-ChildItem -Path asio -Recurse -Filter iasiodrv.h | Select-Object -First 1).Directory.Parent.FullName
          "dir=$dir" >> $env:GITHUB_OUTPUT
          Write-Host "ASIO SDK at $dir"

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Every step below reports failures as an annotation containing the relevant log lines,
      # so problems are readable from the run summary / API without downloading logs.
      - name: Configure (clang-cl + MSVC libraries)
        shell: pwsh
        run: |
          clang-cl --version
          $asio = "${{ steps.asio.outputs.dir }}"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DWIS_ASIO_SDK_DIR="$asio" 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) {
            $msg = ((Get-Content configure.log | Select-Object -Last 70) -replace '%','%25') -join '%0A'
            Write-Host "::error title=Configure failed::$msg"
            exit 1
          }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --parallel 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            $errs = Get-Content build.log | Where-Object { $_ -match 'error|FAILED|fatal' } | Select-Object -First 60
            if (-not $errs) { $errs = Get-Content build.log | Select-Object -Last 60 }
            $msg = (($errs) -replace '%','%25') -join '%0A'
            Write-Host "::error title=Build failed::$msg"
            exit 1
          }

      # ---- the 32-bit plugin bridge (old 32-bit VST2 plugins such as Delay Lama) ----
      - name: Build the bridge smoke test (64-bit)
        shell: pwsh
        run: |
          cl /nologo /O2 /EHsc /MT /std:c++17 Tools\Bridge32\BridgeSmokeTest.cpp /Fe:build\BridgeSmokeTest.exe /Fo:build\ 2>&1 | Tee-Object -FilePath bridge64.log
          if ($LASTEXITCODE -ne 0) { $msg = ((Get-Content bridge64.log) -replace '%','%25') -join '%0A'; Write-Host "::error title=Bridge smoke test build failed::$msg"; exit 1 }

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_x86

      - name: Build wisbridge32.exe and a 32-bit test plugin
        shell: pwsh
        run: |
          cl /nologo /O2 /EHsc /MT /std:c++17 /DUNICODE /D_UNICODE Tools\Bridge32\WisBridge32.cpp /Fe:build\wisbridge32.exe /Fo:build\ /link user32.lib gdi32.lib shell32.lib /SUBSYSTEM:WINDOWS 2>&1 | Tee-Object -FilePath bridge32.log
          if ($LASTEXITCODE -ne 0) { $msg = ((Get-Content bridge32.log) -replace '%','%25') -join '%0A'; Write-Host "::error title=Bridge build failed::$msg"; exit 1 }
          cl /nologo /O2 /EHsc /MT /std:c++17 /LD Tools\TestVst2Plugin.cpp /Fe:build\wis_test_vst2_x86.dll /Fo:build\ /link user32.lib gdi32.lib 2>&1 | Tee-Object -FilePath plugin32.log
          if ($LASTEXITCODE -ne 0) { $msg = ((Get-Content plugin32.log) -replace '%','%25') -join '%0A'; Write-Host "::error title=32-bit test plugin build failed::$msg"; exit 1 }

      - name: Test - 32-bit plugin bridge
        shell: pwsh
        timeout-minutes: 3
        run: |
          build\BridgeSmokeTest.exe "$PWD\build\wisbridge32.exe" "$PWD\build\wis_test_vst2_x86.dll" 2>&1 | Tee-Object -FilePath bridgetest.log
          $code = $LASTEXITCODE
          $msg = ((Get-Content bridgetest.log) -replace '%','%25') -join '%0A'
          if ($code -ne 0) { Write-Host "::error title=Bridge test failed::$msg"; exit 1 }
          Write-Host "::notice title=32-bit bridge::$msg"

      - name: Test - rig DSP, tuner, player, engine
        shell: pwsh
        run: |
          build\rigtest_artefacts\Release\rigtest.exe 2>&1 | Tee-Object -FilePath rigtest.log
          $code = $LASTEXITCODE
          $msg = ((Get-Content rigtest.log) -replace '%','%25') -join '%0A'
          if ($code -ne 0) { Write-Host "::error title=rigtest failed::$msg"; exit 1 }
          Write-Host "::notice title=rigtest (Windows)::$msg"

      - name: Test - Studio (DAW engine, instruments, effects, recording, export)
        shell: pwsh
        run: |
          $env:WIS_SOUNDFONT = "$PWD\sounds\GeneralUser-GS.sf2"
          $env:WIS_PIANOS = "$PWD\pianos"
          $env:WIS_BRIDGE32 = "$PWD\build\wisbridge32.exe"
          $env:WIS_TEST_VST2_X86 = "$PWD\build\wis_test_vst2_x86.dll"
          build\dawtest_artefacts\Release\dawtest.exe 2>&1 | Tee-Object -FilePath dawtest.log
          $code = $LASTEXITCODE
          $msg = ((Get-Content dawtest.log) -replace '%','%25') -join '%0A'
          if ($code -ne 0) { Write-Host "::error title=dawtest failed::$msg"; exit 1 }
          Write-Host "::notice title=dawtest (Windows)::$msg"

      - name: Test - every plugin editor opens and paints
        shell: pwsh
        timeout-minutes: 5
        run: |
          $env:WIS_SOUNDFONT = "$PWD\sounds\GeneralUser-GS.sf2"
          $p = Start-Process -FilePath build\WOMANINSTEM_artefacts\Release\WOMANINSTEM.exe -ArgumentList '--selftest-ui' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Host "::error title=UI self-test failed::exit code $($p.ExitCode)"; exit 1 }
          Write-Host "UI self-test passed"

      - name: Test - end-to-end stem separation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:APPDATA\WOMANINSTEM\models" | Out-Null
          Copy-Item "models/$env:MODEL_FILE" "$env:APPDATA\WOMANINSTEM\models\"
          build\stemsplit_artefacts\Release\stemsplit.exe --selftest selftest-out 2>&1 | Tee-Object -FilePath selftest.log
          $code = $LASTEXITCODE
          $msg = ((Get-Content selftest.log | Select-Object -Last 40) -replace '%','%25') -join '%0A'
          if ($code -ne 0) { Write-Host "::error title=Separation self-test failed::$msg"; exit 1 }
          Write-Host "::notice title=Separation self-test (Windows)::$msg"

      - name: Package
        shell: pwsh
        run: |
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(WOMANINSTEM VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          "VERSION=$ver" >> $env:GITHUB_ENV
          $d = "dist/WOMANINSTEM"
          New-Item -ItemType Directory -Force -Path "$d/models" | Out-Null
          New-Item -ItemType Directory -Force -Path "$d/sounds" | Out-Null
          Copy-Item build/WOMANINSTEM_artefacts/Release/WOMANINSTEM.exe $d/
          Copy-Item sounds/GeneralUser-GS.sf2 "$d/sounds/"
          Copy-Item sounds/GeneralUser-GS-LICENSE.txt "$d/sounds/"
          Copy-Item pianos -Destination "$d/pianos" -Recurse
          Copy-Item build/stemsplit_artefacts/Release/stemsplit.exe $d/
          Copy-Item build/wisbridge32.exe $d/
          Copy-Item "models/$env:MODEL_FILE" "$d/models/"
          Copy-Item LICENSE "$d/LICENSE.txt"
          Copy-Item THIRD_PARTY_NOTICES.md "$d/THIRD_PARTY_NOTICES.txt"
          Copy-Item packaging/README.txt "$d/README.txt"
          Compress-Archive -Path $d -DestinationPath "dist/WOMANINSTEM-$ver-windows-x64.zip" -Force
          Get-ChildItem dist

      - name: Build installer
        shell: pwsh
        continue-on-error: true
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /DAppVersion=$env:VERSION /DSourceDir="$PWD\dist\WOMANINSTEM" /O"$PWD\dist" packaging\installer.iss
          Get-ChildItem dist

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: WOMANINSTEM-windows-x64
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

      # A release is published automatically for every new version number in CMakeLists.txt
      # (push to main), or when a v* tag is pushed. Existing releases are left untouched.
      - name: Check whether this version is already released
        id: rel
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v$env:VERSION" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "publish=false" >> $env:GITHUB_OUTPUT; Write-Host "v$env:VERSION already released" }
          else { "publish=true" >> $env:GITHUB_OUTPUT }
          $global:LASTEXITCODE = 0

      - name: Publish release
        if: steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: WOMANINSTEM ${{ env.VERSION }}
          body_path: packaging/RELEASE_NOTES.md
          make_latest: true
          files: |
            dist/*.zip
            dist/*-setup.exe

  linux:
    name: Linux (build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libgl1-mesa-dev libcurl4-openssl-dev ninja-build xvfb

      - name: Cache sound library
        id: sf-cache
        uses: actions/cache@v4
        with:
          path: sounds
          key: generaluser-gs-${{ env.SF_COMMIT }}

      - name: Download sound library
        if: steps.sf-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p sounds
          curl -fsSL -o sounds/GeneralUser-GS.sf2 "https://raw.githubusercontent.com/mrbumpy409/GeneralUser-GS/$SF_COMMIT/GeneralUser-GS.sf2"
          echo "$SF_SHA256  sounds/GeneralUser-GS.sf2" | sha256sum -c -

      - name: Cache piano samples
        id: piano-cache
        uses: actions/cache@v4
        with:
          path: pianos
          key: pianos-${{ hashFiles('Tools/prep_pianos.py') }}

      - name: Build the piano sample packs
        if: steps.piano-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install --quiet --break-system-packages soundfile numpy || python3 -m pip install --quiet soundfile numpy
          python3 Tools/prep_pianos.py piano-dl pianos

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-linux-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps-linux-

      - name: Configure & build
        run: |
          set -o pipefail
          report() { echo "::error title=$1::$(grep -E 'error|FAILED|Error' "$2" | head -60 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release 2>&1 | tee configure.log || report "Configure failed" configure.log
          cmake --build build --parallel 2>&1 | tee build.log || report "Build failed" build.log

      - name: Test - rig DSP, tuner, player, engine
        run: |
          set -o pipefail
          ./build/rigtest_artefacts/Release/rigtest 2>&1 | tee rigtest.log || { echo "::error title=rigtest failed::$(sed 's/%/%25/g' rigtest.log | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }

      - name: Test - Studio (DAW engine, instruments, effects, recording, export)
        run: |
          set -o pipefail
          WIS_SOUNDFONT=$PWD/sounds/GeneralUser-GS.sf2 WIS_PIANOS=$PWD/pianos ./build/dawtest_artefacts/Release/dawtest 2>&1 | tee dawtest.log || { echo "::error title=dawtest failed::$(sed 's/%/%25/g' dawtest.log | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }

      - name: Test - every plugin editor opens and paints
        timeout-minutes: 5
        run: |
          set -o pipefail
          WIS_SOUNDFONT=$PWD/sounds/GeneralUser-GS.sf2 xvfb-run -a ./build/WOMANINSTEM_artefacts/Release/WOMANINSTEM --selftest-ui 2>&1 | tee uitest.log || { echo "::error title=UI self-test failed::$(sed 's/%/%25/g' uitest.log | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }

      - name: Test - end-to-end stem separation (downloads the model)
        run: |
          set -o pipefail
          ./build/stemsplit_artefacts/Release/stemsplit --selftest selftest-out 2>&1 | tee selftest.log || { echo "::error title=Separation self-test failed::$(tail -40 selftest.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
          echo "::notice title=Separation self-test (Linux)::$(tail -15 selftest.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"

      - name: Benchmark - memory and speed per worker thread (3-minute song)
        if: github.event_name == 'workflow_dispatch'
        run: |
          for t in 1 3; do
            ./build/stemsplit_artefacts/Release/stemsplit --selftest --long --threads $t bench-$t > bench-$t.log 2>&1 || true
            echo "threads=$t: $(grep -E 'Done in|Peak memory|Reconstruction|ERROR' bench-$t.log | tr '\n' ' ')" >> bench.txt
          done
          echo "::notice title=Separation benchmark (Linux, 4 vCPU)::$(sed 's/%/%25/g' bench.txt | sed ':a;N;$!ba;s/\n/%0A/g')"
